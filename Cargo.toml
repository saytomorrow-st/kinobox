[workspace]
resolver = "2"
members = [
    "crates/kino-core",
    "crates/kino-api",
    "crates/kino-player",
    "crates/kino-store",
    "crates/kino-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
url = { version = "=2.5.8", features = ["serde"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
pollster = { version = "=1.0.1", default-features = false }

kino-core = { path = "crates/kino-core" }
kino-api = { path = "crates/kino-api" }
kino-player = { path = "crates/kino-player" }
kino-store = { path = "crates/kino-store" }
kino-ipc = { path = "crates/kino-ipc" }
