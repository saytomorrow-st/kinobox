name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ---- Universal libmpv.dylib (#019) -------------------------------------
  # Источник для arm64 — готовая Homebrew-бутылка (один job на macos-latest,
  # ниже). Для x86_64 нужен отдельный job (Intel-раннер macos-15-intel,
  # `macos-13` ретирован 04.12.2025): Rosetta на arm64-раннере не даёт
  # x86_64-бутылки в /usr/local. Universal-файлы сливаются через lipo уже на
  # arm64-раннере до сборки бандла.
  #
  # x86_64-бутылка mpv собирается Homebrew со Swift-кодом macOS-backend,
  # который требует символ AppKit, появившийся только в macOS 14+ — краш при
  # старте на более старых ОС (баг #11). Поэтому на x86_64 mpv собирается из
  # исходников с патчем формулы (Swift таргетирован на macOS 13.0), а не
  # ставится готовой бутылкой.
  # ------------------------------------------------------------------------
  libmpv-x86_64:
    runs-on: macos-15-intel
    steps:
      # Бутылка ffmpeg для x86_64 тащит libavdevice с AVFoundation-кодом
      # захвата камеры/экрана, который на macOS 14+ использует
      # AVCaptureDeviceTypeContinuityCamera — на 13.x краш при старте
      # (баг #12). KinoBox — только плеер, захват устройств не нужен.
      # Та же схема патча тапа, что у mpv ниже (баг #11).
      - name: Install ffmpeg (x86_64, built from source, --disable-avfoundation — bug #12)
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -euo pipefail
          brew tap homebrew/core
          FFMPEG_FORMULA="$(brew --repository homebrew/core)/Formula/f/ffmpeg.rb"
          perl -pi -e 's/(--enable-openssl)/$1\n      --disable-avfoundation/' "$FFMPEG_FORMULA"
          grep -q 'disable-avfoundation' "$FFMPEG_FORMULA" || {
            echo "ERROR: patch did not apply to ffmpeg.rb (upstream formula changed?)" >&2
            exit 1
          }
          brew install --build-from-source ffmpeg

      # Бутылка mpv для x86_64 собрана Homebrew со Swift-кодом macOS-backend
      # (Touch Bar / media-key интеграция), который требует символ AppKit,
      # появившийся только в macOS 14 — краш при старте на более старых ОС
      # (баг #11). Патчим формулу прямо в чекауте тапа homebrew-core (install
      # по пути Homebrew отклоняет: "requires formulae to be in a tap") и
      # собираем mpv из исходников; ffmpeg уже собран выше (баг #12).
      # HOMEBREW_NO_INSTALL_FROM_API=1 обязателен: иначе brew резолвит
      # формулу из своего JSON API, игнорируя патч в локальном чекауте тапа.
      # Swift НЕЛЬЗЯ просто выключить — cocoa-код mpv всегда тянет
      # сгенерированный osdep/mac/swift.h, а cocoa нужен для gl-cocoa
      # (OpenGL render API, нужен kino-player через FFI). Таргетируем Swift
      # явно на macOS 13.0 и выключаем только touch bar/media-key модули.
      - name: Install mpv (x86_64, built from source, Swift targeted at macOS 13 — bug #11)
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -euo pipefail
          brew tap homebrew/core
          MPV_FORMULA="$(brew --repository homebrew/core)/Formula/m/mpv.rb"
          perl -pi -e 's/(-Dbuild-date=false)/$1\n    -Dcplayer=false\n    -Dmacos-touchbar=disabled\n    -Dmacos-media-player=disabled\n    -Dswift-flags=-target\\ x86_64-apple-macosx13.0\n    -Dc_args=-mmacosx-version-min=13.0\n    -Dobjc_args=-mmacosx-version-min=13.0\n    -Dc_link_args=-mmacosx-version-min=13.0\n    -Dobjc_link_args=-mmacosx-version-min=13.0/' "$MPV_FORMULA"
          # -Dcplayer=false отключает мезоновский install_data для
          # bash-completion, но formula.install всё равно безусловно его
          # ждёт (bash_completion.install share/"...") — убираем эту строку.
          perl -ni -e 'print unless /bash_completion\.install/' "$MPV_FORMULA"
          grep -q 'Dswift-flags' "$MPV_FORMULA" || {
            echo "ERROR: patch did not apply to mpv.rb (upstream formula changed?)" >&2
            exit 1
          }
          brew install --build-from-source mpv

      - name: Show bottle architectures (diagnostics)
        run: lipo -info "$(brew --prefix mpv)/lib/libmpv.2.dylib"

      # Префикс копируем с -L (раскрыть симлинки): скрипту вендоринга нужны
      # настоящие dylib-файлы в lib/, а не симлинки Homebrew.
      - name: Stage x86_64 mpv prefix
        run: |
          mkdir -p "$RUNNER_TEMP/libmpv-x86_64"
          cp -RL "$(brew --prefix mpv)" "$RUNNER_TEMP/libmpv-x86_64/mpv"

      - name: Upload x86_64 mpv prefix
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-x86_64
          path: ${{ runner.temp }}/libmpv-x86_64/mpv
          retention-days: 3

  release:
    permissions:
      contents: write
    needs: libmpv-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Setup Go (wreq/BoringSSL build)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download x86_64 libmpv (from macos-15-intel job)
        uses: actions/download-artifact@v4
        with:
          name: libmpv-x86_64
          path: ${{ runner.temp }}/libmpv-x86_64

      - name: Install dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # arm64-половина universal libmpv.dylib.
      - name: Install mpv (arm64 bottle)
        run: brew install mpv

      # Почему сборка разбита так, а не одним `tauri build` с вендорингом внутри:
      #   1. tauri-bundler УДАЛЯЕТ .app перед каждой сборкой
      #      (fs::remove_dir_all(app_bundle_path)), поэтому всё, что лежит внутри
      #      .app, живёт до следующей сборки бандла.
      #   2. install_name_tool должен пройти ДО codesign, иначе правка ломает подпись.
      #   3. bundled .app собирается копированием бинаря из cargo target dir
      #      (copy_binaries_to_bundle), значит патчить надо именно источник в
      #      target dir, а стейджинг dylib держать вне .app.
      #   4. tauri.macos.conf.json должен существовать ДО первой компиляции:
      #      tauri-build следит за конфигами (rerun-if-changed) и при появлении
      #      нового файла между --no-bundle и финальной сборкой триггерит
      #      релинк, который стирает патч install_name_tool. Поэтому vendoring
      #      и запись конфига идут первыми, компиляция — после них.
      # Отсюда: dylib готовим в $RUNNER_TEMP, пишем bundle.macOS.frameworks,
      # собираем бинарь один раз, патчим его в target dir — и даём tauri-action
      # собрать/подписать/упаковать бандл единственным проходом без релинка.

      # lipo + install_name_tool: universal dylib-ы в стейджинг-каталог ВНЕ .app,
      # ссылки внутри них → @rpath. lipo -info и otool -L печатаются скриптом.
      - name: Vendor universal libmpv (staging outside .app)
        run: |
          scripts/vendor-libmpv.sh \
            "$(brew --prefix mpv)" \
            "$RUNNER_TEMP/libmpv-x86_64/mpv" \
            "$RUNNER_TEMP/vendored-libmpv"

      # bundle.macOS.frameworks — абсолютные пути к dylib в стейджинге (НЕ внутри
      # .app). Список берём из .manifest, который пишет vendor-libmpv.sh. Файл
      # должен появиться ДО первой компиляции (см. комментарий выше).
      - name: Write tauri.macos.conf.json (frameworks from staging)
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/vendored-libmpv"
          {
            echo '{"bundle":{"macOS":{"frameworks":['
            first=1
            while IFS= read -r name; do
              [[ -n "$name" ]] || continue
              [[ $first -eq 0 ]] && echo -n ","
              echo -n "\"$STAGE/$name\""
              first=0
            done < "$STAGE/.manifest"
            echo ']}}}'
          } > src-tauri/tauri.macos.conf.json
          cat src-tauri/tauri.macos.conf.json

      # Сборка бинаря в target dir без бандла: нам нужен только файл
      # target/universal-apple-darwin/release/KinoBox для патча. Путь — от
      # корня cargo workspace (src-tauri — член workspace), не от src-tauri/.
      - name: Build universal binary (no bundle)
        run: cargo tauri build --target universal-apple-darwin --no-bundle
        working-directory: src-tauri

      # ВНИМАНИЕ (известный риск, не покрыт этим фиксом): build-dev.yml показал,
      # что `cargo tauri build` перелинковывает Rust-бинарь при КАЖДОМ вызове
      # независимо от --no-bundle/--bundles (смена CLI-флагов/signing-окружения
      # триггерит rerun-if-env-changed), так что патч здесь может быть стёрт
      # следующим вызовом `tauri build` внутри tauri-action. В build-dev.yml это
      # решено единственным проходом сборки + патчем УЖЕ ВНУТРИ .app — здесь так
      # сделать не вышло напрямую, т.к. install_name_tool должен быть ДО
      # codesign, а codesign делает tauri-action за один шаг с бандлингом. Если
      # release-сборка упадёт на "Verify vendored libmpv" с абсолютными путями —
      # смотреть сюда первым делом.
      #
      # Патч бинаря В TARGET DIR (не внутри .app): LC_LOAD_DYLIB →
      # @rpath/libmpv.2.dylib + LC_RPATH @executable_path/../Frameworks.
      - name: Patch binary in cargo target dir
        run: |
          scripts/patch-app-binary.sh \
            "target/universal-apple-darwin/release/KinoBox"

      # Единственный реальный проход сборки бандла: tauri-action вызывает
      # `tauri build` (бинарь уже пропатчен, dylib подхватятся из
      # tauri.macos.conf.json), подписывает .app вместе с вложенными dylib,
      # собирает dmg и публикует релиз.
      - name: Sign, bundle and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KinoBox ${{ github.ref_name }}'
          releaseBody: 'См. CHANGELOG.md'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

      # Проверка итогового подписанного .app (tauri-action оставляет его на месте,
      # dmg собирается из него). Живой запуск в CI невозможен, поэтому это
      # единственная автоматическая гарантия самодостаточности бандла.
      - name: Verify vendored libmpv
        run: |
          set -euo pipefail
          APP=target/universal-apple-darwin/release/bundle/macos/KinoBox.app
          lipo -info "$APP/Contents/Frameworks/libmpv.2.dylib"
          otool -L "$APP/Contents/MacOS/KinoBox"
          otool -l "$APP/Contents/MacOS/KinoBox" | grep -A2 LC_RPATH
          if otool -L "$APP/Contents/MacOS/KinoBox" "$APP"/Contents/Frameworks/*.dylib \
              | grep -E "/(opt/homebrew|usr/local)/"; then
            echo "ERROR: absolute Homebrew paths survived bundling" >&2
            exit 1
          fi

          # Регрессия бага #11: убеждаемся, что x86_64-слайс libmpv реально
          # таргетит старую macOS, а не тянет Swift-код с AppKit-символом,
          # появившимся в 14+ (см. -Dswift-flags/-Dmacos-touchbar/
          # -Dmacos-media-player выше).
          MIN_VER=$(otool -arch x86_64 -l "$APP/Contents/Frameworks/libmpv.2.dylib" \
            | awk '$1=="minos" || $1=="version" {print $2; exit}')
          if [[ -z "$MIN_VER" ]]; then
            echo "ERROR: could not determine libmpv x86_64 minimum macOS version" >&2
            exit 1
          fi
          if (( ${MIN_VER%%.*} > 13 )); then
            echo "ERROR: libmpv.2.dylib (x86_64) requires macOS ${MIN_VER}+ — bug #11 regressed" >&2
            exit 1
          fi
          echo "libmpv.2.dylib x86_64 minimum macOS: $MIN_VER (OK)"

          # Регрессия бага #12: ffmpeg's libavdevice не должен тянуть
          # AVFoundation-символ захвата камеры (нужен только на macOS 14+,
          # см. --disable-avfoundation в job'е libmpv-x86_64).
          AVDEV="$APP/Contents/Frameworks/libavdevice.63.dylib"
          if nm -arch x86_64 "$AVDEV" 2>/dev/null | grep -q '_AVCaptureDeviceTypeContinuityCamera'; then
            echo "ERROR: libavdevice.63.dylib (x86_64) still references AVCaptureDeviceTypeContinuityCamera — bug #12 regressed" >&2
            exit 1
          fi
          AVDEV_MIN=$(otool -arch x86_64 -l "$AVDEV" \
            | awk '$1=="minos" || $1=="version" {print $2; exit}')
          if [[ -n "$AVDEV_MIN" ]] && (( ${AVDEV_MIN%%.*} > 13 )); then
            echo "ERROR: libavdevice.63.dylib (x86_64) requires macOS ${AVDEV_MIN}+ — bug #12 regressed" >&2
            exit 1
          fi
          echo "libavdevice.63.dylib x86_64: no ContinuityCamera symbol, minimum macOS ${AVDEV_MIN:-unknown} (OK)"
