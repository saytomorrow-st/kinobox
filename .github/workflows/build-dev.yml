name: Build dev app

# Ручная сборка universal .app для проверки без тега релиза. Запускается из вкладки
# Actions кнопкой "Run workflow". Приложение не публикуется — только скачивается
# как артефакт на 14 дней. Собранный .app CI никогда не запускает (нет GUI, нет
# Keychain CI-машины с настоящими данными) — безопасность проверяет тот, кто скачал.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или тег для сборки"
        required: false
        default: ""
      arch:
        description: "universal (arm64+x86_64, ждёт macos-latest) или x86_64 (только Intel-раннер, без очереди на arm64)"
        required: false
        type: choice
        default: universal
        options:
          - universal
          - x86_64

jobs:
  build:
    # universal-сборка собирается, только если явно не попросили x86_64-only.
    if: ${{ inputs.arch != 'x86_64' }}
    # Нужен второй job: x86_64-префикс mpv для lipo (см. комментарий ниже).
    needs: libmpv-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ---- Universal libmpv.dylib (#019) -----------------------------------
      # Источник: официальные Homebrew-бутылки mpv под каждую архитектуру.
      # Одна бутылка — одна архитектура, поэтому на arm64-раннере (macos-latest)
      # нужна вторая, x86_64. Её достаём отдельным job'ом `libmpv-x86_64` на
      # Intel-раннере `macos-13` (Rosetta на arm64-раннере даёт x86_64 *процессы*,
      # но Homebrew в /usr/local ставится нативно и бутылку под Intel там
      # получить существенно сложнее, чем взять готовый Intel-раннер) и
      # передаём между job'ами артефактом.
      # Зачем именно Homebrew: mpv.io не раздаёт universal libmpv.dylib,
      # а сборка mpv из исходников тянет meson/ffmpeg/libplacebo и занимает
      # десятки минут на runner — бутылки быстрее и воспроизводимее.
      # ---------------------------------------------------------------------
      - name: Download x86_64 libmpv (from macos-13 job)
        uses: actions/download-artifact@v4
        with:
          name: libmpv-x86_64
          path: ${{ runner.temp }}/libmpv-x86_64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Setup Go (wreq/BoringSSL build)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      # arm64-половина universal libmpv.dylib: бутылка под архитектуру раннера.
      - name: Install mpv (arm64 bottle)
        run: brew install mpv

      # Почему сборка разбита так, а не одним `tauri build` с вендорингом внутри:
      #   1. tauri-bundler УДАЛЯЕТ .app перед каждой сборкой
      #      (fs::remove_dir_all(app_bundle_path)), поэтому всё, что лежит внутри
      #      .app, живёт до следующей сборки бандла.
      #   2. install_name_tool должен пройти ДО codesign, иначе правка ломает подпись.
      #   3. бандлер собирает .app копированием бинаря из cargo target dir
      #      (copy_binaries_to_bundle), значит патчить надо именно источник в
      #      target dir, а стейджинг dylib держать вне .app.
      # Отсюда: бинарь собираем один раз, патчим его в target dir, dylib готовим
      # в $RUNNER_TEMP, указываем на них через bundle.macOS.frameworks — и
      # собираем бандл единственным проходом.

      # Сборка бинаря в target dir без бандла: нужен только файл
      # src-tauri/target/universal-apple-darwin/debug/KinoBox для патча.
      - name: Build universal binary (no bundle)
        run: cargo tauri build --debug --target universal-apple-darwin --no-bundle
        working-directory: src-tauri

      # lipo + install_name_tool: universal-файлы в стейджинг-каталог ВНЕ .app.
      # lipo -info и otool -L печатаются внутри скрипта — по ним в логе CI видно,
      # что dylib действительно universal (fat) и путей Homebrew не осталось.
      - name: Vendor universal libmpv (staging outside .app)
        run: |
          scripts/vendor-libmpv.sh \
            "$(brew --prefix mpv)" \
            "$RUNNER_TEMP/libmpv-x86_64/mpv" \
            "$RUNNER_TEMP/vendored-libmpv"

      # Патч бинаря В TARGET DIR (не внутри .app): LC_LOAD_DYLIB →
      # @rpath/libmpv.2.dylib + LC_RPATH @executable_path/../Frameworks.
      - name: Patch binary in cargo target dir
        run: |
          scripts/patch-app-binary.sh \
            "src-tauri/target/universal-apple-darwin/debug/KinoBox"

      # bundle.macOS.frameworks — абсолютные пути к dylib в стейджинге (НЕ внутри
      # .app). Список берём из .manifest, который пишет vendor-libmpv.sh.
      - name: Write tauri.macos.conf.json (frameworks from staging)
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/vendored-libmpv"
          {
            echo '{"bundle":{"macOS":{"frameworks":['
            first=1
            while IFS= read -r name; do
              [[ -n "$name" ]] || continue
              [[ $first -eq 0 ]] && echo -n ","
              echo -n "\"$STAGE/$name\""
              first=0
            done < "$STAGE/.manifest"
            echo ']}}}'
          } > src-tauri/tauri.macos.conf.json
          cat src-tauri/tauri.macos.conf.json

      # Единственный проход сборки бандла: бинарь уже пропатчен, dylib
      # подхватятся из tauri.macos.conf.json.
      - name: Build universal .app
        run: cargo tauri build --debug --target universal-apple-darwin --bundles app
        working-directory: src-tauri

      # Живой запуск в CI невозможен, поэтому самодостаточность бандла
      # проверяется по otool: ни одной абсолютной ссылки Homebrew быть не должно.
      - name: Verify vendored libmpv
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/debug/bundle/macos/KinoBox.app
          lipo -info "$APP/Contents/Frameworks/libmpv.2.dylib"
          otool -L "$APP/Contents/MacOS/KinoBox"
          otool -l "$APP/Contents/MacOS/KinoBox" | grep -A2 LC_RPATH
          if otool -L "$APP/Contents/MacOS/KinoBox" "$APP"/Contents/Frameworks/*.dylib \
              | grep -E "/(opt/homebrew|usr/local)/"; then
            echo "ERROR: absolute Homebrew paths survived bundling" >&2
            exit 1
          fi

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: KinoBox-debug-universal
          path: src-tauri/target/universal-apple-darwin/debug/bundle/macos/KinoBox.app
          retention-days: 14

  # x86_64-only: та же сборка, но без universal/lipo и без второго раннера —
  # весь процесс на одном Intel-раннере (macos-13). Для разработчика на Intel
  # Mac, которому важен быстрый прогон без очереди на macos-latest (arm64).
  # Не публикуется в release.yml — только этот ручной workflow.
  build-x86_64:
    if: ${{ inputs.arch == 'x86_64' }}
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Go (wreq/BoringSSL build)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install mpv (x86_64 bottle)
        run: brew install mpv

      - name: Build x86_64 binary (no bundle)
        run: cargo tauri build --debug --target x86_64-apple-darwin --no-bundle
        working-directory: src-tauri

      # Single-arch вендоринг: та же идея, что и universal-путь (стейджинг
      # вне .app, @rpath), но без lipo — просто копируем бутылку как есть.
      - name: Vendor single-arch libmpv (staging outside .app)
        run: |
          scripts/vendor-libmpv.sh \
            "$(brew --prefix mpv)" \
            "$(brew --prefix mpv)" \
            "$RUNNER_TEMP/vendored-libmpv"

      - name: Patch binary in cargo target dir
        run: |
          scripts/patch-app-binary.sh \
            "src-tauri/target/x86_64-apple-darwin/debug/KinoBox"

      - name: Write tauri.macos.conf.json (frameworks from staging)
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/vendored-libmpv"
          {
            echo '{"bundle":{"macOS":{"frameworks":['
            first=1
            while IFS= read -r name; do
              [[ -n "$name" ]] || continue
              [[ $first -eq 0 ]] && echo -n ","
              echo -n "\"$STAGE/$name\""
              first=0
            done < "$STAGE/.manifest"
            echo ']}}}'
          } > src-tauri/tauri.macos.conf.json
          cat src-tauri/tauri.macos.conf.json

      - name: Build x86_64 .app
        run: cargo tauri build --debug --target x86_64-apple-darwin --bundles app
        working-directory: src-tauri

      - name: Verify vendored libmpv
        run: |
          set -euo pipefail
          APP=src-tauri/target/x86_64-apple-darwin/debug/bundle/macos/KinoBox.app
          lipo -info "$APP/Contents/Frameworks/libmpv.2.dylib"
          otool -L "$APP/Contents/MacOS/KinoBox"
          otool -l "$APP/Contents/MacOS/KinoBox" | grep -A2 LC_RPATH
          if otool -L "$APP/Contents/MacOS/KinoBox" "$APP"/Contents/Frameworks/*.dylib \
              | grep -E "/(opt/homebrew|usr/local)/"; then
            echo "ERROR: absolute Homebrew paths survived bundling" >&2
            exit 1
          fi

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: KinoBox-debug-x86_64
          path: src-tauri/target/x86_64-apple-darwin/debug/bundle/macos/KinoBox.app
          retention-days: 14

  # Вторая архитектура libmpv: на Intel-раннере Homebrew ставит x86_64-бутылки
  # в /usr/local. Кладём весь префикс mpv (dylib + зависимости) артефактом —
  # vendoring-скрипт соберёт из двух префиксов universal-файлы.
  libmpv-x86_64:
    if: ${{ inputs.arch != 'x86_64' }}
    runs-on: macos-13
    steps:
      - name: Install mpv (x86_64 bottle)
        run: brew install mpv

      - name: Show bottle architectures (diagnostics)
        run: lipo -info "$(brew --prefix mpv)/lib/libmpv.2.dylib"

      # Путь артефакта должен быть предсказуем для job'а `build`
      # ($RUNNER_TEMP/libmpv-x86_64/mpv), а /usr/local/opt — симлинк, поэтому
      # копируем префикс целиком с -L (раскрыть симлинки, чтобы dylib-файлы
      # действительно лежали в lib/).
      - name: Stage x86_64 mpv prefix
        run: |
          mkdir -p "$RUNNER_TEMP/libmpv-x86_64"
          cp -RL "$(brew --prefix mpv)" "$RUNNER_TEMP/libmpv-x86_64/mpv"

      - name: Upload x86_64 mpv prefix
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-x86_64
          path: ${{ runner.temp }}/libmpv-x86_64/mpv
          retention-days: 3
