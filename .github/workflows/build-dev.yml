name: Build dev app

# Ручная сборка universal .app для проверки без тега релиза. Запускается из вкладки
# Actions кнопкой "Run workflow". Приложение не публикуется — только скачивается
# как артефакт на 14 дней. Собранный .app CI никогда не запускает (нет GUI, нет
# Keychain CI-машины с настоящими данными) — безопасность проверяет тот, кто скачал.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или тег для сборки"
        required: false
        default: ""
      arch:
        description: "universal (arm64+x86_64, ждёт macos-latest) или x86_64 (только Intel-раннер, без очереди на arm64)"
        required: false
        type: choice
        default: universal
        options:
          - universal
          - x86_64

jobs:
  build:
    # universal-сборка собирается, только если явно не попросили x86_64-only.
    if: ${{ inputs.arch != 'x86_64' }}
    # Нужен второй job: x86_64-префикс mpv для lipo (см. комментарий ниже).
    needs: libmpv-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ---- Universal libmpv.dylib (#019) -----------------------------------
      # Источник: официальные Homebrew-бутылки mpv под каждую архитектуру.
      # Одна бутылка — одна архитектура, поэтому на arm64-раннере (macos-latest)
      # нужна вторая, x86_64. Её достаём отдельным job'ом `libmpv-x86_64` на
      # Intel-раннере `macos-15-intel` (Rosetta на arm64-раннере даёт x86_64 *процессы*,
      # но Homebrew в /usr/local ставится нативно и бутылку под Intel там
      # получить существенно сложнее, чем взять готовый Intel-раннер) и
      # передаём между job'ами артефактом.
      # Зачем именно Homebrew: mpv.io не раздаёт universal libmpv.dylib,
      # а сборка mpv из исходников тянет meson/ffmpeg/libplacebo и занимает
      # десятки минут на runner — бутылки быстрее и воспроизводимее.
      # ---------------------------------------------------------------------
      - name: Download x86_64 libmpv (from macos-15-intel job)
        uses: actions/download-artifact@v4
        with:
          name: libmpv-x86_64
          path: ${{ runner.temp }}/libmpv-x86_64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Setup Go (wreq/BoringSSL build)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      # arm64-половина universal libmpv.dylib: бутылка под архитектуру раннера.
      # LIBRARY_PATH обязателен: `brew --prefix`/lib не входит в путь поиска `cc`,
      # без него линковка падает с "library 'mpv' not found" (см. ci.yml).
      - name: Install mpv (arm64 bottle)
        run: |
          HOMEBREW_NO_BUILD_FROM_SOURCE=1 brew install mpv
          echo "LIBRARY_PATH=$(brew --prefix)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # Почему порядок такой:
      #   1. `cargo tauri build` перелинковывает Rust-бинарь при КАЖДОМ вызове,
      #      включая повторный с другими флагами (--no-bundle → --bundles app) —
      #      смена CLI-аргументов меняет env, которое tauri-build отслеживает
      #      через rerun-if-env-changed, так что kinobox-app пересобирается
      #      заново. Поэтому сборка бандла — РОВНО ОДИН вызов `cargo tauri
      #      build --bundles app`, без отдельного --no-bundle прохода: патчить
      #      бинарь в target dir перед вторым вызовом бессмысленно, патч всё
      #      равно сотрёт релинк.
      #   2. Раз сборка одна, патчим бинарь УЖЕ ВНУТРИ .app
      #      (Contents/MacOS/KinoBox) после неё — никто больше не перезатирает.
      #   3. install_name_tool должен пройти ДО codesign (его тут нет — сборка
      #      debug, ad-hoc подписи tauri-bundler не трогает LC_LOAD_DYLIB).
      #   4. tauri.macos.conf.json (bundle.macOS.frameworks) должен существовать
      #      ДО единственной компиляции — список вендоренных dylib нужен
      #      бандлеру для copy_frameworks прямо в этой сборке.
      # Отсюда порядок: vendor dylib в $RUNNER_TEMP → написать
      # tauri.macos.conf.json → собрать .app один раз → патчить бинарь внутри
      # .app.

      # lipo + install_name_tool: universal-файлы в стейджинг-каталог ВНЕ .app.
      # lipo -info и otool -L печатаются внутри скрипта — по ним в логе CI видно,
      # что dylib действительно universal (fat) и путей Homebrew не осталось.
      - name: Vendor universal libmpv (staging outside .app)
        run: |
          scripts/vendor-libmpv.sh \
            "$(brew --prefix mpv)" \
            "$RUNNER_TEMP/libmpv-x86_64/mpv" \
            "$RUNNER_TEMP/vendored-libmpv"

      # bundle.macOS.frameworks — абсолютные пути к dylib в стейджинге (НЕ внутри
      # .app). Список берём из .manifest, который пишет vendor-libmpv.sh. Файл
      # должен появиться ДО единственной компиляции (см. комментарий выше).
      - name: Write tauri.macos.conf.json (frameworks from staging)
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/vendored-libmpv"
          {
            echo '{"bundle":{"macOS":{"frameworks":['
            first=1
            while IFS= read -r name; do
              [[ -n "$name" ]] || continue
              [[ $first -eq 0 ]] && echo -n ","
              echo -n "\"$STAGE/$name\""
              first=0
            done < "$STAGE/.manifest"
            echo ']}}}'
          } > src-tauri/tauri.macos.conf.json
          cat src-tauri/tauri.macos.conf.json

      # Единственная сборка (не --no-bundle + --bundles app раздельно — см.
      # комментарий выше). Путь к target dir идёт от корня cargo workspace
      # (src-tauri — член workspace, не отдельный крейт), а не от src-tauri/ —
      # несмотря на working-directory: src-tauri.
      - name: Build universal .app
        run: cargo tauri build --debug --target universal-apple-darwin --bundles app
        working-directory: src-tauri

      # Патч бинаря ВНУТРИ .app (не в target dir — см. комментарий выше):
      # LC_LOAD_DYLIB → @rpath/libmpv.2.dylib + LC_RPATH
      # @executable_path/../Frameworks.
      - name: Patch binary inside .app
        run: |
          scripts/patch-app-binary.sh \
            "target/universal-apple-darwin/debug/bundle/macos/KinoBox.app/Contents/MacOS/KinoBox"

      # lipo (universal-склейка) и install_name_tool (патч LC_LOAD_DYLIB/-id)
      # портят исходную подпись Homebrew-бутылок — Gatekeeper на скачанном
      # (quarantine xattr) .app видит невалидную подпись и либо спрашивает
      # разрешение на КАЖДУЮ dylib по отдельности, либо прямо пишет
      # "приложение повреждено". Ad-hoc codesign всего бандла целиком
      # (--deep подписывает вложенные Frameworks/*.dylib тоже) после патча —
      # единственное надёжное исправление. Без --options runtime (hardened
      # runtime не нужен для debug-сборки, и так не требует валидации библиотек).
      - name: Codesign app bundle (ad-hoc)
        run: |
          set -euo pipefail
          APP=target/universal-apple-darwin/debug/bundle/macos/KinoBox.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      # Живой запуск в CI невозможен, поэтому самодостаточность бандла
      # проверяется по otool: ни одной абсолютной ссылки Homebrew быть не должно.
      - name: Verify vendored libmpv
        run: |
          set -euo pipefail
          APP=target/universal-apple-darwin/debug/bundle/macos/KinoBox.app
          lipo -info "$APP/Contents/Frameworks/libmpv.2.dylib"
          otool -L "$APP/Contents/MacOS/KinoBox"
          otool -l "$APP/Contents/MacOS/KinoBox" | grep -A2 LC_RPATH
          if otool -L "$APP/Contents/MacOS/KinoBox" "$APP"/Contents/Frameworks/*.dylib \
              | grep -E "/(opt/homebrew|usr/local)/"; then
            echo "ERROR: absolute Homebrew paths survived bundling" >&2
            exit 1
          fi

          # Регрессия бага #11: убеждаемся, что x86_64-слайс libmpv реально
          # таргетит старую macOS, а не тянет Swift-код с AppKit-символом,
          # появившимся в 14+ (см. -Dswift-build=disabled выше). Проверяем
          # именно x86_64-слайс universal-бинаря — он нужен юзеру.
          MIN_VER=$(otool -arch x86_64 -l "$APP/Contents/Frameworks/libmpv.2.dylib" \
            | awk '$1=="minos" || $1=="version" {print $2; exit}')
          if [[ -z "$MIN_VER" ]]; then
            echo "ERROR: could not determine libmpv x86_64 minimum macOS version" >&2
            exit 1
          fi
          if (( ${MIN_VER%%.*} > 13 )); then
            echo "ERROR: libmpv.2.dylib (x86_64) requires macOS ${MIN_VER}+ — bug #11 regressed" >&2
            exit 1
          fi
          echo "libmpv.2.dylib x86_64 minimum macOS: $MIN_VER (OK)"

      # path указывает на родительскую папку (bundle/macos), а не на сам
      # KinoBox.app: upload-artifact при загрузке ОДНОЙ директории кладёт в
      # архив её СОДЕРЖИМОЕ, теряя имя самой директории — т.е. если указать
      # путь прямо на KinoBox.app, в артефакте окажется голый Contents/ без
      # обёртки ".app" (Finder видит это как unix-бинарник, не как
      # приложение). Указывая родителя, сохраняем "KinoBox.app" как дочернюю
      # запись с правильным именем/расширением.
      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: KinoBox-debug-universal
          path: target/universal-apple-darwin/debug/bundle/macos
          retention-days: 14

  # x86_64-only: та же сборка, но без universal/lipo и без второго раннера —
  # весь процесс на одном Intel-раннере (macos-15-intel, `macos-13` ретирован
  # 04.12.2025 и теперь просто висит в queued навечно вместо явного фейла).
  # Для разработчика на Intel Mac, которому важен быстрый прогон без очереди
  # на macos-latest (arm64). Не публикуется в release.yml — только этот
  # ручной workflow.
  build-x86_64:
    if: ${{ inputs.arch == 'x86_64' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Go (wreq/BoringSSL build)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      # Бутылка mpv для x86_64 собирается Homebrew со Swift-кодом macOS-backend
      # (Touch Bar / media-key интеграция), который тянет символ AppKit,
      # появившийся только в macOS 14 — на 13.x бинарь падает при старте
      # (баг #11, см. crash report с "Symbol not found ... NSWindowLevel").
      # `brew install --build-from-source` не принимает произвольный .rb-файл
      # по пути ("Homebrew requires formulae to be in a tap") — поэтому
      # патчим формулу ПРЯМО в чекауте тапа homebrew-core и ставим по имени.
      # Зависимости (ffmpeg, libass, ...) остаются обычными бутылками —
      # Swift-символ есть только в самом mpv.
      #
      # HOMEBREW_NO_INSTALL_FROM_API=1 обязателен: иначе brew резолвит
      # формулу из своего JSON API (кэш ghcr.io), игнорируя патч в
      # локальном чекауте тапа — подтверждено логом ("API Source mpv.rb",
      # установилась неизменённая 0.41.0_8 вместо патченной 0.42.0).
      - name: Install mpv (x86_64, built from source, Swift disabled — bug #11)
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -euo pipefail
          brew tap homebrew/core
          MPV_FORMULA="$(brew --repository homebrew/core)/Formula/m/mpv.rb"
          perl -pi -e 's/(-Dbuild-date=false)/$1\n    -Dswift-build=disabled\n    -Dc_args=-mmacosx-version-min=13.0\n    -Dobjc_args=-mmacosx-version-min=13.0\n    -Dc_link_args=-mmacosx-version-min=13.0\n    -Dobjc_link_args=-mmacosx-version-min=13.0/' "$MPV_FORMULA"
          grep -q 'Dswift-build=disabled' "$MPV_FORMULA" || {
            echo "ERROR: patch did not apply to mpv.rb (upstream formula changed?)" >&2
            exit 1
          }
          brew install --build-from-source mpv
          echo "LIBRARY_PATH=$(brew --prefix)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # Single-arch вендоринг: та же идея, что и universal-путь (стейджинг
      # вне .app, @rpath), но без lipo — просто копируем бутылку как есть.
      # Идёт ДО единственной компиляции (см. комментарий в universal job'е
      # выше: сборка бандла — ровно один `cargo tauri build --bundles app`,
      # патч бинаря делается после неё, внутри .app).
      - name: Vendor single-arch libmpv (staging outside .app)
        run: |
          scripts/vendor-libmpv.sh \
            "$(brew --prefix mpv)" \
            "$(brew --prefix mpv)" \
            "$RUNNER_TEMP/vendored-libmpv"

      - name: Write tauri.macos.conf.json (frameworks from staging)
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/vendored-libmpv"
          {
            echo '{"bundle":{"macOS":{"frameworks":['
            first=1
            while IFS= read -r name; do
              [[ -n "$name" ]] || continue
              [[ $first -eq 0 ]] && echo -n ","
              echo -n "\"$STAGE/$name\""
              first=0
            done < "$STAGE/.manifest"
            echo ']}}}'
          } > src-tauri/tauri.macos.conf.json
          cat src-tauri/tauri.macos.conf.json

      - name: Build x86_64 .app
        run: cargo tauri build --debug --target x86_64-apple-darwin --bundles app
        working-directory: src-tauri

      - name: Patch binary inside .app
        run: |
          scripts/patch-app-binary.sh \
            "target/x86_64-apple-darwin/debug/bundle/macos/KinoBox.app/Contents/MacOS/KinoBox"

      # Та же причина, что в universal job'е: lipo/install_name_tool портят
      # подпись Homebrew-бутылок, из-за чего Gatekeeper на скачанном .app
      # либо спрашивает разрешение на каждую dylib отдельно, либо пишет
      # "приложение повреждено". Ad-hoc codesign всего бандла (--deep на
      # вложенные Frameworks/*.dylib) после патча — обязателен.
      - name: Codesign app bundle (ad-hoc)
        run: |
          set -euo pipefail
          APP=target/x86_64-apple-darwin/debug/bundle/macos/KinoBox.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Verify vendored libmpv
        run: |
          set -euo pipefail
          APP=target/x86_64-apple-darwin/debug/bundle/macos/KinoBox.app
          lipo -info "$APP/Contents/Frameworks/libmpv.2.dylib"
          otool -L "$APP/Contents/MacOS/KinoBox"
          otool -l "$APP/Contents/MacOS/KinoBox" | grep -A2 LC_RPATH
          if otool -L "$APP/Contents/MacOS/KinoBox" "$APP"/Contents/Frameworks/*.dylib \
              | grep -E "/(opt/homebrew|usr/local)/"; then
            echo "ERROR: absolute Homebrew paths survived bundling" >&2
            exit 1
          fi

          # Регрессия бага #11: убеждаемся, что libmpv реально таргетит
          # старую macOS, а не тянет Swift-код с AppKit-символом, появившимся
          # в 14+ (см. -Dswift-build=disabled выше).
          MIN_VER=$(otool -l "$APP/Contents/Frameworks/libmpv.2.dylib" \
            | awk '$1=="minos" || $1=="version" {print $2; exit}')
          if [[ -z "$MIN_VER" ]]; then
            echo "ERROR: could not determine libmpv minimum macOS version" >&2
            exit 1
          fi
          if (( ${MIN_VER%%.*} > 13 )); then
            echo "ERROR: libmpv.2.dylib requires macOS ${MIN_VER}+ — bug #11 regressed" >&2
            exit 1
          fi
          echo "libmpv.2.dylib minimum macOS: $MIN_VER (OK)"

      # path — родительская папка, не сам .app (см. комментарий у universal
      # job'а выше: upload-artifact разворачивает одну директорию без
      # обёртки её именем).
      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: KinoBox-debug-x86_64
          path: target/x86_64-apple-darwin/debug/bundle/macos
          retention-days: 14

  # Вторая архитектура libmpv: на Intel-раннере Homebrew ставит x86_64-бутылки
  # в /usr/local. Кладём весь префикс mpv (dylib + зависимости) артефактом —
  # vendoring-скрипт соберёт из двух префиксов universal-файлы.
  libmpv-x86_64:
    if: ${{ inputs.arch != 'x86_64' }}
    runs-on: macos-15-intel
    steps:
      # Та же причина, что и в job'е build-x86_64 выше (баг #11): бутылка
      # mpv для x86_64 собрана со Swift-кодом macOS-backend, который требует
      # macOS 14+. Собираем из исходников с отключённым Swift, патчим формулу
      # прямо в чекауте тапа homebrew-core (install по пути отклоняется
      # Homebrew'ом: "requires formulae to be in a tap").
      # HOMEBREW_NO_INSTALL_FROM_API=1 обязателен: иначе brew резолвит
      # формулу из своего JSON API, игнорируя патч в локальном чекауте тапа.
      - name: Install mpv (x86_64, built from source, Swift disabled — bug #11)
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -euo pipefail
          brew tap homebrew/core
          MPV_FORMULA="$(brew --repository homebrew/core)/Formula/m/mpv.rb"
          perl -pi -e 's/(-Dbuild-date=false)/$1\n    -Dswift-build=disabled\n    -Dc_args=-mmacosx-version-min=13.0\n    -Dobjc_args=-mmacosx-version-min=13.0\n    -Dc_link_args=-mmacosx-version-min=13.0\n    -Dobjc_link_args=-mmacosx-version-min=13.0/' "$MPV_FORMULA"
          grep -q 'Dswift-build=disabled' "$MPV_FORMULA" || {
            echo "ERROR: patch did not apply to mpv.rb (upstream formula changed?)" >&2
            exit 1
          }
          brew install --build-from-source mpv

      - name: Show bottle architectures (diagnostics)
        run: lipo -info "$(brew --prefix mpv)/lib/libmpv.2.dylib"

      # Путь артефакта должен быть предсказуем для job'а `build`
      # ($RUNNER_TEMP/libmpv-x86_64/mpv), а /usr/local/opt — симлинк, поэтому
      # копируем префикс целиком с -L (раскрыть симлинки, чтобы dylib-файлы
      # действительно лежали в lib/).
      - name: Stage x86_64 mpv prefix
        run: |
          mkdir -p "$RUNNER_TEMP/libmpv-x86_64"
          cp -RL "$(brew --prefix mpv)" "$RUNNER_TEMP/libmpv-x86_64/mpv"

      - name: Upload x86_64 mpv prefix
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-x86_64
          path: ${{ runner.temp }}/libmpv-x86_64/mpv
          retention-days: 3
